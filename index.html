    <!-- Muat marked.js untuk menukar Markdown kepada HTML -->

    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f4f6; /* Warna latar belakang kelabu muda */
            padding: 20px; /* Tambah padding untuk responsif pada skrin kecil */
        }
        .container {
            max-width: 90%;
            width: 700px; /* Lebarkan sedikit kontena */
            box-sizing: border-box; /* Pastikan padding termasuk dalam lebar */
            position: relative; /* Diperlukan untuk kedudukan butang manual */
        }
        /* Style untuk butang mikrofon (ikon mikrofon) */
        .microphone-icon {
            font-size: 2.5rem; /* Saiz ikon yang lebih besar */
            color: #ffffff; /* Warna putih */
            transition: transform 0.2s ease-in-out;
        }
        .microphone-icon.recording {
            color: #ef4444; /* Warna merah apabila merakam */
            transform: scale(1.1); /* Sedikit membesar apabila merakam */
        }
        /* Style untuk input dan textarea */
        input[type="text"], input[type="date"], input[type="time"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            margin-bottom: 15px;
            font-size: 1rem;
            box-sizing: border-box; /* Pastikan padding termasuk dalam lebar */
        }
        /* Output area for rich text */
        #meetingMinutesOutput, #whatsappMinutesOutput {
            width: 100%;
            padding: 15px; /* Lebih padding untuk rich text */
            border-radius: 8px;
            border: 1px solid #d1d5db;
            margin-bottom: 15px;
            font-size: 1rem;
            min-height: 200px; /* Ketinggian minimum yang lebih besar */
            background-color: #f9fafb; /* Warna latar belakang lebih cerah */
            overflow-y: auto; /* Boleh scroll jika kandungan panjang */
            line-height: 1.6; /* Ketinggian baris yang lebih baik untuk pembacaan */
        }
        /* Styling for markdown generated elements */
        #meetingMinutesOutput h1, #meetingMinutesOutput h2 {
            font-weight: bold;
            margin-top: 1.5em;
            margin-bottom: 0.8em;
            color: #1f2937;
        }
        #meetingMinutesOutput h1 { font-size: 1.875rem; } /* text-3xl */
        #meetingMinutesOutput h2 { font-size: 1.5rem; } /* text-2xl */
        #meetingMinutesOutput p {
            margin-bottom: 1em;
            color: #374151;
        }
        #meetingMinutesOutput ul {
            list-style-type: disc;
            margin-left: 20px;
            margin-bottom: 1em;
            color: #374151;
        }
        #meetingMinutesOutput li {
            margin-bottom: 0.5em;
        }
        #meetingMinutesOutput table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1em;
            margin-bottom: 1em;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
        }
        #meetingMinutesOutput th, #meetingMinutesOutput td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: left;
        }
        #meetingMinutesOutput th {
            background-color: #e0e7ff; /* Latar belakang header jadual */
            font-weight: 600;
            color: #374151;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4b5563;
        }
        /* Style untuk butang aksi */
        .action-button {
            background-color: #10b981; /* Hijau */
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 9999px; /* Rounded-full */
            color: white;
            transition: background-color 0.3s ease-in-out;
            cursor: pointer; /* Menunjukkan ia boleh diklik */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px; /* Ruang antara ikon dan teks */
            white-space: nowrap; /* Elak teks butang daripada melingkar */
        }
        .action-button:hover {
            background-color: #059669; /* Hijau gelap */
        }
        .copy-transcript-button {
            background-color: #6366f1; /* Indigo */
        }
        .copy-transcript-button:hover {
            background-color: #4f46e5; /* Indigo gelap */
        }
        .download-button {
            background-color: #007bff; /* Biru terang untuk Word */
        }
        .download-button:hover {
            background-color: #0056b3; /* Biru gelap */
        }
        .whatsapp-button {
            background-color: #25d366; /* Warna WhatsApp Green */
        }
        .whatsapp-button:hover {
            background-color: #1da851; /* Warna WhatsApp Green yang lebih gelap */
        }
        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Loading spinner */
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            overflow-y: auto; /* Boleh scroll jika kandungan panjang */
            padding: 20px;
        }
        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh; /* Hadkan ketinggian modal */
            overflow-y: auto; /* Boleh scroll kandungan modal */
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);

        .modal-content h1, .modal-content h2 {
            font-weight: bold;
            margin-top: 1em;
            margin-bottom: 0.5em;

        }
        .modal-content h1 { font-size: 1.75rem; }
        .modal-content h2 { font-size: 1.35rem; }
        .modal-content p, .modal-content ul {
            margin-bottom: 1em;
            color: #374151;
        }
        .modal-content ul {
            list-style-type: disc;
            margin-left: 20px;
        }
        .modal-close-button {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #4b5563;
            transition: color 0.2s;
        }
        .modal-close-button:hover {
            color: #ef4444;
        }
    </style>

            const userManualContent = document.getElementById('userManualContent');

            let recognition;

            let fullTranscript = '';
            let aiGeneratedMarkdownMinutes = '';
            let aiGeneratedWhatsappText = '';

            const now = new Date();

            meetingTimeInput.value = now.toTimeString().slice(0, 5);

            // Kandungan README dalam format Markdown (akan dimuatkan ke modal)
            const readmeContentMarkdown = `
# README: Aplikasi Suara ke Teks Minit Mesyuarat CAIRO UTM

Selamat datang ke Aplikasi Suara ke Teks Minit Mesyuarat CAIRO UTM! Aplikasi web ini direka untuk membantu anda merekod dan menjana minit mesyuarat secara efisien menggunakan teknologi pengecaman suara dan kecerdasan buatan.

---

## 🎯 Apakah Aplikasi Ini?

Aplikasi ini membolehkan anda merakam perbincangan mesyuarat anda melalui mikrofon, menukarkan ucapan kepada teks, dan kemudian menjana minit mesyuarat yang diformat dengan baik secara automatik. Ia juga menyediakan pilihan untuk menyalin transkrip mentah, menyalin minit rich text, memuat turun minit dalam format yang serasi dengan Microsoft Word, dan menyalin versi ringkas untuk perkongsian WhatsApp.

---

## ✨ Ciri-Ciri Utama

* **Transkripsi Suara ke Teks:** Merakam ucapan anda secara *real-time* dan menukarkannya kepada teks.
* **Penjanaan Minit Mesyuarat Berasaskan AI:** Menggunakan AI untuk memproses transkripsi dan menjana minit mesyuarat yang profesional dengan butiran, perkara perbincangan, dan perkara tindakan dalam format rich text (Markdown yang boleh dipaparkan sebagai HTML).
* **Butiran Mesyuarat:** Input medan untuk tajuk mesyuarat, tarikh, masa, dan senarai ahli yang hadir.
* **Salin Transkrip Mentah:** Butang untuk menyalin teks transkripsi mentah ke papan keratan.
* **Salin Minit Rich Text:** Butang untuk menyalin minit mesyuarat yang dijana AI (termasuk pemformatan) ke papan keratan.
* **Muat Turun (.doc):** Muat turun minit mesyuarat dalam format fail \`.doc\` yang serasi dengan Microsoft Word.
* **Salin Mesej WhatsApp:** Butang khusus untuk menyalin minit ringkas yang diformat dengan kemas dan emoji untuk perkongsian mudah di WhatsApp.
* **Logo & Copyright CAIRO UTM:** Memaparkan logo dan frasa *copyright* CAIRO UTM.

---

## 🚀 Cara Menggunakan

1.  **Buka Aplikasi:** Buka fail \`index.html\` ini dalam pelayar web moden anda (Google Chrome sangat disyorkan untuk sokongan Web Speech API terbaik).
2.  **Isi Butiran Mesyuarat:**
    * Masukkan \`Tajuk Mesyuarat\`.
